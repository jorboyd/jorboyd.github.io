<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Jordan Boyd — Filmmaker / Director / Producer</title>
<meta name="description" content="Jordan Boyd — filmmaker, director, producer. Selected work.">
<meta name="theme-color" content="#F5EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16120E" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DIRECTION A — "THE MARQUEE"  ·  palette: LINEN
   Story: a matinee house with the lobby lights up — warm ivory walls,
   ink on the bill, one clean stroke of Carolina blue as the marquee.
   Palette: linen #F5EFE6 ground / warm-charcoal #2B2723 ink /
   Carolina blue #4B9CD3 as the single accent — the true UNC hue
   for type, rules, bulbs & fills. Purest: base + ink + blue.
   ===================================================================== */
:root{
  color-scheme:light dark;   /* both schemes are authored below — browser must not invent its own */
  --base:#F5EFE6; --panel:#EBE0CF;
  --ink:#2B2723; --mut:#6E6459;
  --blue:#4B9CD3; --blue-ink:#4B9CD3;
  --scrim:#17110B; --onimg:#F7EFE4; --onimg2:#A9D0EC;
  --line:color-mix(in srgb, var(--ink) 15%, transparent);
  --disp:'Instrument Serif', serif;
  --sys:'DM Mono', monospace;
  --ez:cubic-bezier(.22,.61,.36,1);
  --gutter:clamp(18px,4.5vw,72px);
}
/* ============ HOUSE LIGHTS DOWN (authored dark) ============
   Same marquee, after the matinee: the linen ground goes to warm
   ink-black, the bill prints in ivory, and the Carolina blue is left
   untouched — it is the one lit thing in the room. Photos brighten
   slightly because on a dark ground the frames are the light source. */
@media (prefers-color-scheme: dark){
  :root{
    --base:#16120E; --panel:#231C15;
    --ink:#F0E8DB;  --mut:#9C9084;
    --line:color-mix(in srgb, var(--ink) 18%, transparent);
  }
  /* vignette was a soft ink wash over linen — invert its direction */
  body::before{background:linear-gradient(180deg,transparent 58%,rgba(0,0,0,.45))}
  .cell{filter:saturate(.96) brightness(.95)}
  .frame img{filter:brightness(1) saturate(1)}
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--base)}
body{background:var(--base);color:var(--ink);font-family:var(--sys);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
::selection{background:color-mix(in srgb, var(--blue) 26%, transparent)}
.shell{max-width:1560px;margin:0 auto;padding:0 var(--gutter)}

/* faint warm vignette to ground the page — no colored glow */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,transparent 60%,color-mix(in srgb, var(--ink) 5%, transparent));}
main,header,footer{position:relative;z-index:1}

/* ============ TOP BAR ============ */
.bar{display:flex;justify-content:space-between;align-items:center;gap:18px;
  padding:22px 0 18px;border-bottom:1px solid var(--line)}
.wm{font-family:var(--disp);font-size:clamp(20px,2vw,26px);letter-spacing:.02em;text-transform:uppercase;line-height:1}
.wm em{font-style:normal;color:var(--blue-ink)}
.role{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--mut)}
.bar a.contact{font-family:var(--disp);text-transform:uppercase;letter-spacing:.02em;line-height:1;
  font-size:clamp(20px,2vw,26px);color:var(--blue-ink);transition:color .3s var(--ez)}
.bar a.contact:hover{color:var(--ink)}

/* ============ MARQUEE TICKER (the bill) ============ */
.ticker{border-bottom:1px solid var(--line);overflow:hidden;background:
  linear-gradient(180deg,color-mix(in srgb, var(--panel) 65%, transparent),transparent)}
.ticker-in{display:flex;align-items:center;gap:0;width:max-content;
  padding:14px 0;animation:tick 38s linear infinite;will-change:transform}
.ticker:hover .ticker-in{animation-play-state:paused}
.ticker .t{font-family:var(--disp);font-size:clamp(18px,2.2vw,30px);text-transform:uppercase;
  letter-spacing:.02em;line-height:1;white-space:nowrap;padding:0 clamp(18px,2.2vw,34px);color:var(--ink)}
.ticker .bulb{width:9px;height:9px;border-radius:50%;background:var(--blue);
  border:1px solid color-mix(in srgb, var(--ink) 28%, transparent);box-shadow:0 1px 2px color-mix(in srgb, var(--ink) 22%, transparent);flex:none}
.ticker .t:nth-child(6n+2){color:var(--blue-ink)}
@keyframes tick{to{transform:translateX(-50%)}}

/* ============ HERO FILMSTRIP ============ */
.strip{overflow:hidden;padding:clamp(24px,4vh,42px) 0 8px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
/* the gutter lives on the cells, NOT as a flex gap: with gap, two sets measure
   16w+15g, so the -50% seam lands half a gap short and snaps 7px every loop */
.strip-in{display:flex;width:max-content;animation:slide 34s linear infinite;will-change:transform}
/* pause-on-hover only where a real pointer exists — on touch, :hover sticks
   after a tap, and the strip is tappable now, so it would freeze for good */
@media (hover:hover) and (pointer:fine){.strip:hover .strip-in{animation-play-state:paused}}
@keyframes slide{to{transform:translateX(-50%)}}
/* on touch the strip becomes a genuine scroller you can swipe, and JS drives the
   drift with scrollLeft — momentum, axis-locking and tap-vs-drag come free from
   the browser. touch-action stays at its default: setting pan-x here would trap
   a vertical drag that starts on the strip. */
@media (hover:none),(pointer:coarse){
  .strip{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .strip-in{animation:none}
}
.cell{position:relative;flex:none;margin-right:14px;cursor:pointer;height:clamp(230px,42vh,420px);overflow:hidden;border-radius:3px;
  background:#000;filter:saturate(.92) brightness(.86);transition:filter .5s var(--ez),transform .5s var(--ez)}
.cell.w{width:clamp(360px,44vh,640px)} .cell.n{width:clamp(200px,26vh,360px)}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--op,50% 35%)}
.cell::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 45%,color-mix(in srgb, var(--scrim) 84%, transparent));opacity:.7;transition:opacity .5s}
.cell:hover{filter:saturate(1.08) brightness(1.05);transform:translateY(-4px)}
.cell:hover::after{opacity:.4}
.cell .lab{position:absolute;left:14px;right:14px;bottom:12px;z-index:2}
.cell .lab b{display:block;font-family:var(--disp);text-transform:uppercase;letter-spacing:.01em;
  font-size:clamp(13px,1.3vw,16px);line-height:1.02;color:var(--onimg)}
.cell .lab i{font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--onimg2)}

/* ============ THE BILL / GRID ============ */
main{padding:clamp(56px,8vh,110px) 0 0}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding-bottom:clamp(22px,3.5vh,40px);border-bottom:2px solid var(--blue-ink)}
.hd h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.01em;line-height:.92;
  font-size:clamp(40px,8vw,120px)}
.hd h2 em{font-style:normal;color:var(--blue-ink)}
.hd p{max-width:34ch;color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(30px,4vw,58px) clamp(18px,2.2vw,34px);
  padding:clamp(40px,6vh,72px) 0 0}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
/* mobile top-bar + intro fit: role repeats in the footer, so drop it here to
   keep the name and Contact (both Anton) on one line; stack the synopsis full-width */
@media(max-width:560px){
  .wm{display:flex;flex-direction:column;gap:2px;line-height:1.05}
  .wm .role{margin-left:0!important}
  .hd{flex-direction:column;align-items:flex-start;gap:14px}
  .hd p{max-width:38ch}
}
figure{margin:0}
.frame{position:relative;display:block;width:100%;aspect-ratio:4/5;overflow:hidden;border-radius:3px;
  background:#000;cursor:pointer;border:0;padding:0}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--op,50% 30%);
  filter:brightness(.9) saturate(.95);transition:transform .7s var(--ez),filter .6s var(--ez)}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--op,50% 30%);
  opacity:0;transition:opacity .55s var(--ez)}
.frame video.on{opacity:1}
.frame::before{content:"";position:absolute;inset:0;z-index:2;
  background:linear-gradient(180deg,transparent 55%,color-mix(in srgb, var(--scrim) 52%, transparent));opacity:.55;transition:opacity .5s}
.play{position:absolute;right:12px;bottom:12px;z-index:3;display:flex;align-items:center;gap:7px;
  padding:6px 11px;border-radius:999px;background:var(--blue-ink);color:var(--base);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  opacity:0;transform:translateY(6px);transition:.4s var(--ez)}
figcaption{padding:14px 2px 0}
.ct{font-family:var(--disp);text-transform:uppercase;letter-spacing:.01em;line-height:1;
  font-size:clamp(17px,1.5vw,22px)}
.frame + figcaption .ct{transition:color .3s}
/* hover affordances gated to real pointers — otherwise a phone tap sticks
   the blue title + PLAY pill on (touch :hover persists after tap) */
@media (hover:hover) and (pointer:fine){
  .frame:hover img{transform:scale(1.05);filter:brightness(1.05) saturate(1.08)}
  .frame:hover::before{opacity:.25}
  .frame:hover .play{opacity:1;transform:none}
  figure:hover .ct{color:var(--blue-ink)}
}
.cm{margin-top:6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-ink)}

/* ============ FOOTER ============ */
footer{margin-top:clamp(80px,12vh,150px);border-top:1px solid var(--line);
  padding:clamp(44px,7vh,90px) 0 clamp(40px,6vh,72px);text-align:center}
.f-kick{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);margin-bottom:18px}
.f-mail{font-family:var(--disp);text-transform:uppercase;font-size:clamp(30px,7vw,88px);letter-spacing:.01em;
  line-height:1;display:inline-block;color:var(--blue-ink);transition:filter .3s}
.f-mail:hover{filter:brightness(1.1)}
.f-row{display:flex;justify-content:center;gap:14px;margin-top:26px;flex-wrap:wrap}
.f-row b{font-family:var(--disp);text-transform:uppercase;font-size:15px;letter-spacing:.03em}
.f-row span{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut)}

/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ez),transform .8s var(--ez)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  /* the marquee is the page's one piece of intentional motion and Jordan wants
     it running, so it is exempt; hover still pauses it. Everything else stills. */
  .rv{opacity:1;transform:none;transition:none}
  .cell,.frame img{transition:none}
}

/* ===== TYPE SYSTEM — 3 tiers ===== */
/* HEADS -> lowercase display (Instrument Serif) */
.wm,.hd h2,.f-mail,.bar a.contact{text-transform:lowercase;font-weight:400}
/* MICRO labels / subtitles / nav -> uppercase mono (DM Mono) */
.now b,.ticker .t,.f-row b,.role{font-family:var(--sys)}
/* CARD / STRIP TITLES -> lowercase serif (Instrument Serif, matches the heads) */
.ct,.cell .lab b{font-family:var(--disp);font-weight:400;text-transform:lowercase;letter-spacing:0}

/* ============ SCREENING ROOM ============ */
/* click a card -> the gallery dims and the film plays full-frame */
.lb{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  padding:clamp(16px,4vw,56px);
  background:color-mix(in srgb, var(--scrim) 94%, transparent);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;transition:opacity .45s var(--ez),visibility .45s var(--ez)}
.lb.open{opacity:1;visibility:visible}
.lb-in{width:min(1180px,100%);transform:translateY(14px) scale(.985);transition:transform .5s var(--ez)}
.lb.open .lb-in{transform:none}
.lb video{width:100%;aspect-ratio:16/9;display:block;background:#000;border-radius:3px;
  box-shadow:0 40px 90px rgba(0,0,0,.45)}
.lb-cap{display:flex;justify-content:space-between;align-items:baseline;gap:22px;
  flex-wrap:wrap;margin-top:16px}
.lb-t{font-family:var(--disp);text-transform:lowercase;font-weight:400;line-height:1;
  font-size:clamp(20px,2.4vw,32px);color:var(--onimg)}
.lb-m{font-family:var(--sys);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--onimg2)}
.lb-x{position:absolute;top:clamp(12px,2.5vw,26px);right:clamp(12px,2.5vw,26px);
  width:42px;height:42px;border:0;border-radius:999px;cursor:pointer;line-height:1;font-size:19px;
  background:color-mix(in srgb, var(--onimg) 12%, transparent);color:var(--onimg);
  transition:background .3s var(--ez)}
.lb-x:hover{background:color-mix(in srgb, var(--onimg) 26%, transparent)}
body.lb-lock{overflow:hidden}
/* PLAY is actionable now, so surface it on touch devices too (no hover there) */
@media (hover:none),(pointer:coarse){.play{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="shell">
  <div class="bar">
    <div class="wm">JORDAN <em>BOYD</em> <span class="role" style="margin-left:10px">Filmmaker / Director / Producer</span></div>
    <a class="contact" href="mailto:jordan.boyd@live.com">Contact</a>
  </div>
</div>

<div class="strip"><div class="strip-in" id="strip"></div></div>

<main class="shell">
  <div class="hd rv">
    <h2>FILMMAKER<br><em>PORTFOLIO</em></h2>
    <p>Narrative, brand films, and the in-between. I tell stories about the little bits of life worth telling.</p>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <p class="f-kick rv">Enquiries</p>
  <a class="f-mail rv" href="mailto:jordan.boyd@live.com">jordan.boyd@live.com</a>
  <div class="f-row rv"><b>Jordan Boyd</b><span>Filmmaker / Director / Producer</span></div>
</footer>


<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Screening room" aria-hidden="true">
  <button class="lb-x" id="lbx" aria-label="Close">&#10005;</button>
  <div class="lb-in">
    <video id="lbv" controls playsinline preload="metadata"></video>
    <div class="lb-cap"><div class="lb-t" id="lbt"></div><div class="lb-m" id="lbm"></div></div>
  </div>
</div>

<script>
/* shared reel data */
var FILMS=[
 {s:"chicago-il-common-hero",p:"hero",t:"Common's Chicago",who:"Common",op:"16% 50%",wide:1},
 {s:"bbc-hilary-carmel-digital-final-1-mix",p:"hero",t:"The Serene Carmel-by-the-Sea",who:"Hilary Swank",op:"72% 50%",wide:1},
 {s:"bbc-colman-santa-fe-digital-final-1",p:"hero",t:"Sun-Baked Santa Fe, New Mexico",who:"Colman Domingo",op:"35% 50%",wide:1},
 {s:"little-rock-ar-mary-steenburgen-hero",p:20,t:"Quaint Little Rock, Arkansas",who:"Mary Steenburgen",op:"63% 30%"},
 {s:"bbc-aws-tl-feathersnap-final",p:55,t:"The Art of the Possible: Generative AI",who:"",client:"AWS",op:"55% 38%",wide:1},
 {s:"bbc-helen-el-paso-digital-final",p:20,t:"El Paso, Texas — Where the Desert Meets the Stage",who:"Helen Hunt",op:"50% 30%"},
 {s:"los-angeles-ca-jane-krakowski-hero",p:68,t:"Sunlit Los Angeles, California",who:"Jane Krakowski",op:"72% 50%"},
 {s:"bbc-sheryl-philly-digital-final-1",p:20,t:"Stately Philadelphia, Pennsylvania",who:"Sheryl Lee Ralph",op:"52% 25%"},
 {s:"washington-dc-bradford-young",p:"hero",t:"The Storied Washington, DC",who:"Bradford Young",op:"50% 50%"},
 {s:"bbc-aws-miriam-full-1920x1080-final",p:20,t:"The Cloud: Revolutionizing Manufacturing",who:"",client:"AWS",op:"50% 50%"},
 {s:"bbc-niecy-st-louis-digital-final-1",p:"hero",t:"Soulful St. Louis, Missouri",who:"Niecy Nash",op:"50% 50%"},
 {s:"new-york-city-yaya-dacosta-hero",p:"hero",t:"The Bustling New York City",who:"YaYa DaCosta",op:"50% 50%",wide:1},
 {s:"new-orleans-la-jordana-spiro-hero",p:20,t:"The Artistic New Orleans, Louisiana",who:"Jordana Spiro",op:"33% 35%"},
 {s:"bbc-aws-tl-druva-final",p:85,t:"The Art of Possible: Unlocking Innovation",who:"",client:"AWS",op:"0% 28%"},
 {s:"baltimore-md-aidan-gillen-hero",p:"hero",t:"A Port City on the Sea: Baltimore, Maryland",who:"Aidan Gillen",op:"59% 50%"},
 {s:"hor-2min47-h264-060223",p:9,t:"Designing for a Life Well Crafted",who:"",client:"House of Rohl",op:"57% 40%"},
 {s:"bbc-aws-richard-full-1920x1080-final",p:20,t:"Why the Future of Media & Entertainment is in the Cloud",who:"",client:"AWS",op:"72% 28%"}
];
var A="assets/", V="assets/video/";
function esc(x){return x.replace(/&/g,"&amp;")}

/* hero filmstrip — Jordan's 8, in order (doubled for a seamless loop) */
var STRIP=["hor-2min47-h264-060223","bbc-colman-santa-fe-digital-final-1",
 "bbc-hilary-carmel-digital-final-1-mix","los-angeles-ca-jane-krakowski-hero",
 "chicago-il-common-hero","bbc-sheryl-philly-digital-final-1",
 "little-rock-ar-mary-steenburgen-hero","bbc-aws-tl-druva-final"];
var REEL=STRIP.map(function(s){var i=FILMS.findIndex(function(f){return f.s===s});
  if(i<0)throw new Error("strip slug not in FILMS: "+s); return i;});
/* touch gets a spare set on each side of home, so a hard fling never reaches a
   real edge and the loop wrap can happen later, while the strip is still */
var TOUCH=matchMedia('(hover:none),(pointer:coarse)').matches, SETS=TOUCH?3:2;
var sp="";
for(var d=0;d<SETS;d++){REEL.forEach(function(i){var f=FILMS[i];
  sp+='<div class="cell '+(f.wide?'w':'n')+'" data-i="'+i+'" style="--op:'+f.op+'">'
    +'<img src="'+A+f.s+'-'+f.p+'.jpg" alt="'+esc(f.t)+'" loading="lazy">'
    +'<div class="lab"><b>'+esc(f.t)+'</b>'+(f.who?'<i>'+esc(f.who)+'</i>':'')+'</div></div>';
});}
document.getElementById("strip").innerHTML=sp;

/* swipeable marquee (touch only — desktop keeps the CSS keyframe untouched).
   The strip still drifts on its own; a finger takes it over, and it picks the
   drift back up once you have been still for a moment. */
if(TOUCH)(function(){
  var box=document.querySelector('.strip'), track=document.getElementById('strip');
  var SEC=34, RESUME=2000;            /* one set per 34s, matching desktop */
  var one=0,speed=0,pos=0,ours=0,last=0,idle=-1e9,held=false;

  function measure(){                 /* stride between a cell and its clone = one set */
    one=track.children[REEL.length].offsetLeft-track.children[0].offsetLeft;
    speed=one/SEC; pos=one; box.scrollLeft=pos; ours=box.scrollLeft;
  }

  box.addEventListener('scroll',function(){   /* not ours -> a finger is driving */
    if(Math.abs(box.scrollLeft-ours)<1.5)return;
    pos=ours=box.scrollLeft; idle=performance.now();
  },{passive:true});
  box.addEventListener('pointerdown',function(){held=true;idle=performance.now()},{passive:true});
  ['pointerup','pointercancel'].forEach(function(e){
    box.addEventListener(e,function(){held=false;idle=performance.now()},{passive:true});
  });
  addEventListener('resize',measure);

  requestAnimationFrame(function step(t){
    requestAnimationFrame(step);
    var dt=t-last; last=t;
    if(!one||dt<=0||dt>200)return;                        /* first frame / was backgrounded */
    if(held||t-idle<RESUME)return;                        /* hands off while they browse */
    if(document.hidden||document.body.classList.contains('lb-lock'))return;
    if(pos<one||pos>=one*2)                               /* re-home after a swipe — the sets
                                                             are identical, so nothing is seen */
      pos=one+((pos-one)%one+one)%one;
    pos+=speed*dt/1000;
    if(pos>=one*2)pos-=one;
    box.scrollLeft=pos; ours=box.scrollLeft;
  });

  if(document.readyState==='complete')measure();
  else addEventListener('load',measure);
})();

/* grid */
var g="";
FILMS.forEach(function(f){
  var brand=f.who?'':' brand';
  var meta=f.who?f.who:('Brand film'+(f.client?' | '+f.client:''));
  g+='<figure class="rv">'
    +'<button class="frame" data-loop="'+V+f.s+'-loop.mp4" style="--op:'+f.op+'">'
    +'<img src="'+A+f.s+'-'+f.p+'.jpg" alt="'+esc(f.t)+'" loading="lazy">'
    +'<span class="play">▶ Play</span></button>'
    +'<figcaption><div class="ct">'+esc(f.t)+'</div>'
    +'<div class="cm'+brand+'">'+esc(meta)+'</div></figcaption></figure>';
});
document.getElementById("grid").innerHTML=g;

/* reveal */
if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.08,rootMargin:'0px 0px -6% 0px'});
  document.querySelectorAll('.rv').forEach(function(el){io.observe(el)});
}else document.querySelectorAll('.rv').forEach(function(el){el.classList.add('in')});

/* hover loops — at most one alive */
var reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
var fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
var cur=null;
if(fine&&!reduced){
  document.querySelectorAll('.frame').forEach(function(fr){
    var v=null;
    fr.addEventListener('mouseenter',function(){
      if(cur&&cur!==v){cur.classList.remove('on');try{cur.pause()}catch(e){}}
      if(!v){v=document.createElement('video');v.muted=true;v.loop=true;v.playsInline=true;
        v.src=fr.dataset.loop;v.style.cssText='';fr.appendChild(v);
        v.className='';v.setAttribute('playsinline','');v.classList.add('fv');
        v.style.position='absolute';v.style.inset=0;v.style.width='100%';v.style.height='100%';
        v.style.objectFit='cover';v.style.objectPosition=fr.style.getPropertyValue('--op');
        v.style.opacity=0;v.style.transition='opacity .55s cubic-bezier(.22,.61,.36,1)';
        v.addEventListener('error',function(){v.remove()});}
      cur=v;v.classList.add('on');v.style.opacity=1;var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});
    });
    fr.addEventListener('mouseleave',function(){if(v){v.style.opacity=0;try{v.pause()}catch(e){}}});
  });
}

/* ---- screening room ----------------------------------------------------
   Source swap point: to move to Vimeo/YouTube later, change srcFor() to
   return the embed URL and render an iframe instead of <video>.          */
function srcFor(f){return V+f.s+'-proxy.mp4';}
function metaFor(f){return f.who?f.who:('Brand film'+(f.client?' | '+f.client:''));}
var lb=document.getElementById('lb'),lbv=document.getElementById('lbv'),
    lbt=document.getElementById('lbt'),lbm=document.getElementById('lbm'),
    lbx=document.getElementById('lbx'),lastFocus=null;
function openLB(f){
  lastFocus=document.activeElement;
  if(cur){try{cur.pause()}catch(e){}cur.classList.remove('on');cur.style.opacity=0;cur=null;}
  lbt.textContent=f.t; lbm.textContent=metaFor(f); lbv.src=srcFor(f);
  lb.classList.add('open'); lb.setAttribute('aria-hidden','false');
  document.body.classList.add('lb-lock'); lbx.focus();
  var pr=lbv.play(); if(pr&&pr.catch)pr.catch(function(){});
}
function closeLB(){
  if(!lb.classList.contains('open'))return;
  lb.classList.remove('open'); lb.setAttribute('aria-hidden','true');
  document.body.classList.remove('lb-lock');
  try{lbv.pause()}catch(e){}
  lbv.removeAttribute('src'); lbv.load();          /* stop background buffering */
  if(lastFocus){try{lastFocus.focus()}catch(e){}}
}
document.querySelectorAll('#grid .frame').forEach(function(fr,i){
  fr.addEventListener('click',function(){openLB(FILMS[i])});
});
document.querySelectorAll('#strip .cell').forEach(function(c){
  c.addEventListener('click',function(){openLB(FILMS[+c.dataset.i])});
});
lbx.addEventListener('click',closeLB);
lb.addEventListener('click',function(e){if(e.target===lb)closeLB()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLB()});
</script>
